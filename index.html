<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ef_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- This is a client-rendered SPA, so without this the browser can't
         discover the homepage hero image (the LCP element) until the JS
         bundle has downloaded, parsed, and mounted React. Preloading it
         here lets the fetch start in parallel with the JS bundle instead
         of after it. Loaded on every route since index.html is shared,
         but at under 100KB the cost on non-home pages is small.
         Mobile and desktop show different hero images (the `lg` breakpoint
         is 1024px), so each is preloaded only for its matching width via
         `media` — the browser fetches just the one it'll actually use. -->
    <link rel="preload" as="image" href="/hero-mobile.webp" fetchpriority="high" type="image/webp" media="(max-width: 1023px)" />
    <link rel="preload" as="image" href="/hero-desktop.webp" fetchpriority="high" type="image/webp" media="(min-width: 1024px)" />

    <title>Edhi Foundation — Serving Humanity Since 1951</title>
    <meta
      name="description"
      content="Abdul Sattar Edhi Foundation — Pakistan's largest charity, providing free ambulance services, hospitals, orphan care, and emergency relief regardless of religion, race, or background."
    />

    <meta property="og:site_name" content="Edhi Foundation" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/ef_logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
